openapi: 3.0.1
info:
  title: CityMart Core Agents (Stub)
  version: 0.1.0
paths:
  /payment/charge:
    post:
      summary: Charge a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                amount: { type: number }
                payment_token: { type: string }
                idempotency_key: { type: string }
      responses:
        '200':
          description: success
  /inv/reserve:
    post:
      summary: Reserve inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku_id: { type: string }
                store_id: { type: string }
                qty: { type: integer }
                session_id: { type: string }
                idempotency_key: { type: string }
      responses:
        '200':
          description: reserved
